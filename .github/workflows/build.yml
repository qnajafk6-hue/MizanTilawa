
name: Build Mizan Tilawa APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK Packages
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract Mizan Tilawa Project
        run: |
          mkdir -p project
          unzip -q MizanTilawa.zip -d project
          test -f project/settings.gradle
          test -f project/app/build.gradle

      - name: Build Debug APK
        working-directory: project
        run: gradle --no-daemon assembleDebug

      - name: Verify APK
        run: |
          test -s project/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MizanTilawa-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
